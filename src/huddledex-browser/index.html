gap:15px}.row p{margin:4px 0;font-size:14px}.pill{font-size:12px;color:var(--accent);background:#edf0ff;padding:5px 9px;border-radius:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.wide{grid-column:1/-1}.timeline{margin-top:26px;display:grid;gap:18px}.meeting{border:1px solid var(--line);background:white;border-radius:12px;padding:22px}.meeting p{white-space:pre-wrap;overflow-wrap:anywhere}.photos{display:flex;gap:12px;align-items:start;flex-wrap:wrap;margin:16px 0}.photos figure{margin:0;max-width:100%}.photos img{display:block;max-width:100%;max-height:340px;border-radius:8px;object-fit:contain}.photos figcaption{font-size:12px;color:var(--muted);margin:6px 0}.badge{max-width:150px!important}audio{max-width:100%;height:38px}.clips{display:grid;gap:9px}.clip{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.card-preview{max-width:430px;background:#20294b;color:white;border-radius:18px;padding:30px;margin-bottom:24px}.card-preview p{color:#d1d8f2}.card-preview a{color:#d1d8ff}.card-photo{width:78px;height:78px;object-fit:cover;border-radius:50%;margin-bottom:20px}.card-preview h2{font-size:27px;margin-bottom:8px}.note{padding:12px 16px;border-left:3px solid #aab5ff;background:#eff2ff;font-size:13px;line-height:1.55}dialog{width:min(700px,calc(100% - 24px));max-height:90dvh;padding:25px;border:1px solid var(--line);border-radius:15px;color:inherit;background:var(--paper)}dialog::backdrop{background:#17203366}.dialog-head{display:flex;align-items:start;justify-content:space-between;gap:20px}.dialog-head h2{margin:6px 0 22px}.dialog-head button{padding:6px 10px}.dialog-footer{margin-top:20px;display:flex;justify-content:end;gap:8px}.error{color:#ad283b;white-space:pre-wrap}.status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20294b;color:white;border-radius:10px;padding:12px 20px;max-width:calc(100% - 28px);z-index:20;font-size:14px;box-shadow:0 4px 20px #0002}.status:empty{display:none}.back{margin:0 0 20px;paddin <header><div class="top"><div class="brand">HuddleDex<span>Browser notebook</span></div><div class="actions"><button id="export">Export</button><button id="about" class="quiet">About this build</button></div></div><nav aria-label="Notebook"><button data-view="connections" aria-current="page">Connections</button><button data-view="events">Events</button><button data-view="tasks">Follow-ups</button><button data-view="card">My card</button><button data-view="trash">Trash</button></nav></header>
<main id="app"><p>Opening your notebook…</p></main><dialog id="modal" aria-labelledby="modal-title"></dialog><div id="status" class="status" role="status" aria-live="polite"></div>
<script>
'use strict';
// CORE: no DOM or personal configuration. Kept separate here for regression tests.
const HuddleCore = (()=>{
 const fields=['name','role','company','email','linkedIn','website'];
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fold=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const tags=s=>{const seen=new Set();return s.split(',').map(x=>x.trim().replace(/\s+/g,' ')).filter(x=>x&&!seen.has(fold(x))&&seen.add(fold(x))).sort((a,b)=>a.localeCompare(b));};
 const safeURL=s=>{try{const u=new URL(s);return u.protocol==='https:'&&!u.username&&!u.password?u.href:'';}catch{return '';}};
 function validate(d){if(!d.name?.trim())throw Error('Add a name.');if(d.website&&!safeURL(d.website))throw Error('Use a full HTTPS website address.');if(d.linkedIn){const u=safeURL(d.linkedIn);if(!u||!/(^|\.)linkedin\.com$/.test(new URL(u).hostname))throw Error('Use an HTTPS LinkedIn address.');}}
 const details=o=>Object.fromEntries(fields.map(f=>[f,String(o[f]??'').trim()]));
 function matches(state,p,q,event='',company='',tag=''){
  const ms=state.meetings.filter(m=>m.personID===p.id),text=fold([Object.values(p.details).join(' '),p.tags.join(' '),...ms.map(m=>[Object.values(m.snapshot).join(' '),m.notes,m.task,state.events.find(e=>e.id===m.eventID)?.name].join(' '))].join(' '));
  return !p.deletedAt&&q.trim().split(/\s+/).every(t=>text.includes(fold(t)))&&(!event||ms.some(m=>m.eventID===event))&&(!company||fold(p.details.company)===fold(company))&&(!tag||p.tags.some(t=>fold(t)===fold(tag)));
 }
 const activeMeetings=s=>s.meetings.filter(m=>s.people.some(p=>p.id===m.personID&&!p.deletedAt));
 function rows(s,opts={}){return activeMeetings(s).map(m=>{const p=s.people.find(p=>p.id===m.personID),e=s.events.find(e=>e.id===m.eventID);return {Name:p.details.name,Role:p.details.role,Company:p.details.company,Email:p.details.email,LinkedIn:p.details.linkedIn,Website:p.details.website,Event:e?.name??'',Date:e?.date??'',Venue:e?.venue??'','Met at':m.createdAt,'Recorded name':m.snapshot.name,'Recorded role':m.snapshot.role,'Recorded company':m.snapshot.company,'Recorded email':m.snapshot.email,'Recorded LinkedIn':m.snapshot.linkedIn,'Recorded website':m.snapshot.website,...(opts.tags?{Tags:p.tags.join('; ')}:{}),...(opts.notes?{Notes:m.notes}:{}),...(opts.tasks?{'Follow-up':m.task,Due:m.due,Completed:m.done?'Yes':'No'}:{})};});}
 const csvField=v=>'"'+(/^[\s]*[=+\-@]/.test(String(v))?"'":'')+String(v??'').replace(/"/g,'""')+'"';
 function csv(s,o){const r=rows(s,o);return r.length?[Object.keys(r[0]),...r.map(Object.values)].map(row=>row.map(csvField).join(',')).join('\r\n'):'';}
 function markdown(s,o){return '# HuddleDex export\n\n'+rows(s,o).map(r=>Object.entries(r).map(([k,v])=>k+': '+String(v).replace(/\r/g,'')).join('\n\n')).join('\n\n---\n\n');}
 const vcEscape=v=>String(v??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
 function vcard(d,links=[]){const lines=['BEGIN:VCARD','VERSION:3.0','FN:'+vcEscape(d.name),'N:;'+vcEscape(d.name)+';;;','TITLE:'+vcEscape(d.role),'ORG:'+vcEscape(d.company),'EMAIL:'+vcEscape(d.email)];for(const l of links)if(safeURL(l.url))lines.push('URL:'+safeURL(l.url));if(safeURL(d.website))lines.push('URL:'+safeURL(d.website));if(safeURL(d.linkedIn))lines.push('URL:'+safeURL(d.linkedIn));return [...lines,'END:VCARD'].join('\r\n');}
 // Explicit recipient allowlist: never spread a saved meeting into shared output.
 function memory(m,e){const photo=/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(m.photo||'')?m.photo:'';return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event memory</title><style>body{font:18px system-ui;max-width:800px;margin:40px auto;padding:0 20px;color:#172033}img{width:100%;height:auto;border-radius:12px}p{color:#626b7d}</style><h1>'+esc(e?.name||'An event memory')+'</h1><p>'+esc([e?.date,e?.venue].filter(Boolean).join(' · '))+'</p>'+(photo?'<img alt="Event photo" src="'+photo+'">':'<p>No photo selected.</p>')+'</html>';}
 const blank=()=>({version:1,revision:0,events:[],people:[],meetings:[],activeEventID:'',card:{details:details({}),links:[],photo:''}});
 return {fields,esc,fold,tags,safeURL,validate,details,matches,activeMeetings,rows,csv,markdown,vcard,memory,blank};
})();
// APP
const C=HuddleCore,E=C.esc,$=s=>document.querySelector(s),modal=$('#modal');
let db,state,view='connections',selected='',search='',eventFilter='',companyFilter='',tagFilter='',draft=null,recorder=null,recordStream=null,recordTimer=null,stopPromise=null,statusTimer;
const id=()=>crypto.randomUUID(),today=()=>new Date().toISOString().slice(0,10);
const formatDate=d=>d?new Date(d.length===10?d+'T12:00:00':d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'No date';
function toast(s){$('#status').textContent=s;clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('#status').textContent='',6000);}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('huddledex-public-browser-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('notebook');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(Error('Close another copy of this notebook, then reload.'));});}
function readState(){return new Promise((resolve,reject)=>{const tx=db.transaction('notebook'),r=tx.objectStore('notebook').get('state');r.onsuccess=()=>resolve(r.result||C.blank());r.onerror=()=>reject(r.error);});}
async function save(change){const next=structuredClone(state);change(next);next.revision=state.revision+1;await new Promise((resolve,reject)=>{const tx=db.transaction('notebook','readwrite'),s=tx.objectStore('notebook'),r=s.get('state');let conflict=false;r.onsuccess=()=>{if((r.result?.revision||0)!==state.revision){conflict=true;tx.abort();}else s.put(next,'state');};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('Storage failed.'));tx.onabort=()=>reject(Error(conflict?'This notebook changed in another tab. Reload before saving.':'Could not save. Your previous notebook is unchanged. Download an export or free browser storage and retry.'));});state=next;render();}
const meetingsFor=p=>state.meetings.filter(m=>m.personID===p).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
const personName=p=>p.details.name||'Unnamed connection';
const plural=(n,one,many=one+'s')=>n+' '+(n===1?one:many);
const portrait=p=>{const m=meetingsFor(p.id).find(m=>m.photo);return m?'<img src="'+E(m.photo)+'" alt="'+E(personName(p))+'" loading="lazy">':E(personName(p).split(/\s+/).slice(0,2).map(w=>w[0]).join(''));};
const options=(arr,current,first)=>'<option value="">'+E(first)+'</option>'+arr.map(x=>{const [v,n]=Array.isArray(x)?x:[x,x];return '<option value="'+E(v)+'" '+(v===current?'selected':'')+'>'+E(n)+'</option>';}).join('');
function nav(v){view=v;selected='';render();}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===view?'page':'false'));const app=$('#app');if(view==='connections'&&selected){renderPerson();return;}if(view==='connections'){
 const active=state.people.filter(p=>!p.deletedAt),ps=active.filter(p=>C.matches(state,p,search,eventFilter,companyFilter,tagFilter));
 app.innerHTML='<div class="bar"><div><h1>Connections</h1><p class="muted">'+plural(active.length,'person','people')+' · '+plural(C.activeMeetings(state).length,'encounter')+'</p></div><button class="primary" id="new-meeting">Add encounter</button></div><div class="filters"><label>Search<input id="search" type="search" placeholder="A name, conversation, or company…" value="'+E(search)+'"></label><label>Event<select id="event-filter">'+options(state.events.map(e=>[e.id,e.name]),eventFilter,'All events')+'</select></label><label>Company<select id="company-filter">'+options([...new Set(active.map(p=>p.details.company).filter(Boolean))].sort(),companyFilter,'All companies')+'</select></label><label>Tag<select id="tag-filter">'+options(C.tags(active.flatMap(p=>p.tags).join(',')),tagFilter,'All tags')+'</select></label></div><div id="people-results">'+peopleHTML(ps)+'</div>'+(!state.people.length?'<p class="footnote">Your notebook stays in this browser. Export before clearing site data or changing devices.</p>':'');
 $('#new-meeting').onclick=()=>encounterForm();$('#search').oninput=e=>{search=e.target.value;$('#people-results').innerHTML=peopleHTML(active.filter(p=>C.matches(state,p,search,eventFilter,companyFilter,tagFilter)));bindPeople();};for(const [sel,key]of [['#event-filter','event'],['#company-filter','company'],['#tag-filter','tag']])$(sel).onchange=e=>{if(key==='event')eventFilter=e.target.value;if(key==='company')companyFilter=e.target.value;if(key==='tag')tagFilter=e.target.value;render();};bindPeople();
 }else if(view==='events')renderEvents();else if(view==='tasks')renderTasks();else if(view==='card')renderCard();else if(view==='trash')renderTrash();}
function peopleHTML(ps){return ps.length?'<div class="grid">'+ps.map(p=>{const ms=meetingsFor(p.id),e=state.events.find(e=>e.id===ms[0]?.eventID);return '<button class="person" data-person="'+p.id+'"><div class="portrait">'+portrait(p)+'</div><div class="person-body"><strong>'+E(personName(p))+'</strong><p>'+E([p.details.role,p.details.company].filter(Boolean).join(' · ')||'Contact details to come')+'</p>'+p.tags.map(t=>'<span class="tag">'+E(t)+'</span>').join('')+'<small style="display:block;margin-top:8px">'+ms.length+' encounter'+(ms.length===1?'':'s')+(e?' · '+E(e.name):'')+'</small></div></button>';}).join('')+'</div>':'<div class="empty"><h2>'+(state.people.length?'No matches':'Remember the people you meet.')+'</h2><p>'+(state.people.length?'Try another search or clear a filter.':'Keep a photo, the conversation, and what you want to follow up on. Start with an event, or try a small fictional notebook.')+'</p>'+(!state.people.length?'<div class="actions"><button id="start-event">Create an event</button><button id="demo">Try fictional demo</button></div>':'<button id="clear-filters">Clear filters</button>')+'</div>';}
function bindPeople(){document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{selected=b.dataset.person;view='connections';render();});if($('#demo'))$('#demo').onclick=loadDemo;if($('#start-event'))$('#start-event').onclick=()=>eventForm();if($('#clear-filters'))$('#clear-filters').onclick=()=>{search=eventFilter=companyFilter=tagFilter='';render();};}
function renderPerson(){const p=state.people.find(p=>p.id===selected&&!p.deletedAt);if(!p){selected='';render();return;}const ms=meetingsFor(p.id);$('#app').innerHTML='<button class="quiet back" id="back">← Connections</button><div class="bar"><div><h1>'+E(personName(p))+'</h1><p class="muted">'+E([p.details.role,p.details.company].filter(Boolean).join(' · '))+'</p>'+p.tags.map(t=>'<span class="tag">'+E(t)+'</span>').join('')+'</div><div class="actions"><button id="edit-person">Edit contact</button><button class="primary" id="meet-again">Add encounter</button><button class="quiet danger" id="trash-person">Move to trash</button></div></div><dl class="details">'+['email','linkedIn','website'].filter(f=>p.details[f]).map(f=>'<dt>'+({email:'Email',linkedIn:'LinkedIn',website:'Website'}[f])+'</dt><dd>'+(f==='email'?E(p.details[f]):'<a href="'+E(C.safeURL(p.details[f]))+'" target="_blank" rel="noopener noreferrer">'+E(p.details[f])+'</a>')+'</dd>').join('')+'</dl><h2>Encounters</h2><div class="timeline">'+ms.map(m=>{const e=state.events.find(e=>e.id===m.eventID);return '<article class="meeting"><div class="bar"><div><h3>'+E(e?.name||'Unassigned event')+'</h3><small>'+E(formatDate(m.createdAt))+(e?.venue?' · '+E(e.venue):'')+'</small></div><button data-edit-meeting="'+m.id+'">Edit encounter</button></div><small>Recorded then: '+E([m.snapshot.name,m.snapshot.role,m.snapshot.company].filter(Boolean).join(' · '))+'</small>'+(m.photo||m.badge?'<div class="photos">'+(m.photo?'<figure><img src="'+E(m.photo)+'" alt="Encounter photo"><figcaption>Encounter photo</figcaption></figure>':'')+(m.badge?'<figure class="badge"><img src="'+E(m.badge)+'" alt="Private badge photo"><figcaption>Badge · private</figcaption></figure>':'')+'</div>':'')+(m.notes?'<p>'+E(m.notes)+'</p>':'')+(m.clips.length?'<div class="clips">'+m.clips.map((a,i)=>'<div><small>Recording '+(i+1)+'</small><br><audio controls preload="none" src="'+E(a)+'"></audio></div>').join('')+'</div>':'')+(m.task?'<div class="divi function openModal(title,html,submit,label='Save'){cleanupRecording();draft=null;modal.innerHTML='<div class="dialog-head"><h2 id="modal-title">'+E(title)+'</h2><button type="button" id="close-modal" aria-label="Close dialog">×</button></div><form id="editor">'+html+'<p id="form-error" class="error" role="alert"></p>'+(submit?'<div class="dialog-footer"><button type="button" id="cancel-modal">Cancel</button><button class="primary" type="submit">'+E(label)+'</button></div>':'')+'</form>';$('#close-modal').onclick=()=>modal.close();if($('#cancel-modal'))$('#cancel-modal').onclick=()=>modal.close();$('#editor').onsubmit=async ev=>{ev.preventDefault();if(!submit)return;const b=ev.submitter;b.disabled=true;try{await submit(new FormData(ev.target));modal.close();toast(label.startsWith('Download')?'Download ready.':'Saved.');}catch(err){$('#form-error').textContent=err.message;}finally{b.disabled=false;}};if(!modal.open)modal.showModal();}

function eventForm(event){openModal(event?'Edit event':'New event',field('name','Event name',event?.name||'','text',true)+field('date','Date',event?.date||today(),'date',true)+field('venue','Venue',event?.venue||'')+'<label class="check"><input name="active" type="checkbox" '+(!event||state.activeEventID===event.id?'checked':'')+'>Use for new encounters</label>',async fd=>{await save(s=>{const e={id:event?.id||id(),name:fd.get('name').trim(),date:fd.get('date'),venue:fd.get('venue').trim()};if(!e.name)throw Error('Add an event name.');if(event)s.events[s.events.findIndex(x=>x.id===event.id)]=e;else s.events.push(e);if(fd.has('active'))s.activeEventID=e.id;else if(s.activeEventID===e.id)s.activeEventID='';});});}

function encounterForm(personID='',meetingID=''){

 openModal(existing?'Edit encounter':'Add encounter',(!existing?'<label>Who did you meet?<select id="existing-person"><option value="">Someone new</option>'+state.people.filter(x=>!x.deletedAt).map(x=>'<option value="'+x.id+'" '+(x.id===personID?'selected':'')+'>'+E(personName(x)+(x.details.company?' · '+x.details.company:''))+'</option>').join('')+'</select></label>':'')+'<label>Event<select name="event" required>'+state.events.map(e=>'<option value="'+e.id+'" '+(e.id===d.eventID?'selected':'')+'>'+E(e.name)+'</option>').join('')+'</select></label><div id="contact-fields">'+detailFields(snapshot)+'</div>'+((existing||p)?'<label class="check"><input type="checkbox" name="update-current">Also update current contact details</label>':'')+'<div class="columns"><label>Encounter photo<input type="file" id="photo-input" accept="image/*" capture="user"><span id="photo-preview">'+photoPreview(d.photo,'Encounter photo')+'</span><button type="button" data-remove-photo="photo" class="quiet removal">Remove photo</button></label><label>Badge photo · private<input type="file" id="badge-input" accept="image/*" capture="environment"><span id="badge-preview">'+photoPreview(d.badge,'Badge photo')+'</span><button type="button" data-remove-photo="badge" class="quiet removal">Remove badge</button></label></div><label>Conversation notes<textarea name="notes" rows="4" maxlength="30000" placeholder="What did you talk about?">'+E(d.notes)+'</textarea></label><div class="bar"><h3>Recordings</h3><button type="button" id="record">Record a clip</button></div><p id="record-state" class="muted" role="status"><small>Up to 60 seconds per clip. No automatic transcription.</small></p><div id="draft-clips" class="clips"></div><div class="divider"></div>'+field('task','Follow-up',d.task)+field('due','Due date',d.due,'date')+'<label class="check"><input name="done" type="checkbox" '+(d.done?'checked':'')+'>Follow-up completed</label>',async fd=>{if(recorder&&recorder.state!=='inactive')throw Error('Stop your recording before saving.');if(stopPromise)await stopPromise;const details=C.details(Object.fromEntries(fd));C.validate(details);await save(s=>{let pid=d.personID;if(!pid){pid=id();s.people.push({id:pid,details,tags:[],deletedAt:''});}else if(fd.has('update-current'))s.people.find(x=>x.id===pid).details=details;const m={...d,personID:pid,eventID:fd.get('event'),snapshot:details,notes:fd.get('notes').trim(),task:fd.get('task').trim(),due:fd.get('due'),done:fd.has('done')};if(existing)s.meetings[s.meetings.findIndex(x=>x.id===d.id)]=m;else s.meetings.push(m);});},'Save encounter');

 for(const kind of ['photo','badge'])$('#'+kind+'-input').onchange=async e=>{const file=e.target.files[0];if(!file)return;const button=$('#editor button[type=submit]');button.disabled=true;try{const photo=await resizePhoto(file);if(draft!==d)return;d[kind]=photo;$('#'+kind+'-preview').innerHTML=photoPreview(photo,kind==='photo'?'Encounter photo':'Badge photo');}catch(err){$('#form-error').textContent=err.message;}finally{button.disabled=false;}};
 document.querySelectorAll('[data-remove-photo]').forEach(b=>b.onclick=()=>{d[b.dataset.removePhoto]='';$('#'+b.dataset.removePhoto+'-preview').innerHTML='';});$('#record').onclick=toggleRecording;renderDraftClips();
}
function photoPreview(src,alt){return src?'<img class="photo-preview" src="'+E(src)+'" alt="'+E(alt)+'">':'';}
async function resizePhoto(file){if(!file.type.startsWith('image/')||file.size>20*1024*1024)throw Error('Choose an image under 20 MB.');const image=new Image(),url=URL.createObjectURL(file);try{image.src=url;await image.decode();const scale=Math.min(1,1600/Math.max(image.width,image.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.drawImage(image,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.85);}finally{URL.revokeObjectURL(url);}}
function toDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read recording.'));r.readAsDataURL(blob);});}
function cleanupRecording(){clearTimeout(recordTimer);if(recorder&&recorder.state!=='inactive')recorder.stop();recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;recorder=null;}
async function toggleRecording(){if(recorder&&recorder.state!=='inactive'){recorder.stop();return;}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('#record-state').textContent='Recording is unavailable here. You can still type your notes.';return;}const owner=draft;$('#record').disabled=true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(draft!==owner||!modal.open){stream.getTracks().forEach(t=>t.stop());return;}recordStream=stream;const r=new MediaRecorder(stream),chunks=[];recorder=r;r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};r.onstop=()=>{clearTimeout(recordTimer);stream.getTracks().forEach(t=>t.stop());stopPromise=(async()=>{try{const clip=await toDataURL(new Blob(chunks,{type:r.mimeType}));if(draft===owner&&modal.open){owner.clips.push(clip);renderDraftClips();$('#record').textContent='Record a clip';$('#record-state').textContent='Clip ready. Save the encounter to keep it.';}}catch(err){toast(err.message);}finally{stopPromise=null;}})();};r.start();$('#record').textContent='Stop recording';$('#record-state').textContent='Recording… stops automatically after 60 seconds.';recordTimer=setTimeout(()=>{if(r.state!=='inactive')r.stop();},60000);}catch{$('#record-state').textContent='Microphone unavailable or permission denied. You can still type your notes.';}finally{if($('#record'))$('#record').disabled=false;}}
function renderDraftClips(){if(!draft||!$('#draft-clips'))return;$('#draft-clips').innerHTML=draft.clips.map((a,i)=>'<div class="clip"><audio controls src="'+E(a)+'" preload="none" aria-label="Recording '+(i+1)+'"></audio><button type="button" data-remove-clip="'+i+'">Remove clip '+(i+1)+'</button></div>').join('');document.querySelectorAll('[data-remove-clip]').forEach(b=>b.onclick=()=>{draft.clips.splice(Number(b.dataset.removeClip),1);renderDraftClips();});}
modal.addEventListener('close',()=>{cleanupRecording();draft=null;});

function renderTrash(){$('#app').innerHTML='<h1>Trash</h1><p class="muted">Restore a connection, or delete it and its encounters permanently.</p><div class="list">'+state.people.filter(p=>p.deletedAt).map(p=>'<article class="row"><div><h3>'+E(personName(p))+'</h3><small>'+meetingsFor(p.id).length+' encounters</small></div><div class="actions"><button data-restore="'+p.id+'">Restore</button><button class="danger" data-delete="'+p.id+'">Delete permanently</button></div></article>').join('')+'</div>'+(!state.people.some(p=>p.deletedAt)?'<div class="empty"><p>Trash is empty.</p></div>':'');document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>save(s=>s.people.find(p=>p.id===b.dataset.restore).deletedAt='').catch(e=>toast(e.message)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>confirmAction('Delete permanently?','This removes the connection and all its notes, photos, recordings, and follow-ups from this browser. It cannot be undone.','Delete permanently',()=>save(s=>{s.people=s.people.filter(p=>p.id!==b.dataset.delete);s.meetings=s.meetings.filter(m=>m.personID!==b.dataset.delete);})));}
function renderCard(){const c=state.card,d=c.details;$('#app').innerHTML='<div class="bar"><div><h1>My card</h1><p class="muted">Choose the contact details you want to share.</p></div><button id="edit-card" class="primary">Edit card</button></div>'+(d.name?'<div class="card-preview">'+(c.photo?'<img class="card-photo" src="'+E(c.photo)+'" alt="My card photo">':'')+'<h2>'+E(d.name)+'</h2><p>'+E([d.role,d.company].filter(Boolean).join(' · '))+'</p><p>'+E(d.email)+'</p><div class="stack">'+c.links.filter(l=>C.safeURL(l.url)).map(l=>'<a href="'+E(l.url)+'" target="_blank" rel="noopener noreferrer">'+E(l.label)+'</a>').join('')+'</div></div><button id="download-card">Download contact card (.vcf)</button>':'<div class="empty"><h2>A small introduction to you.</h2><p>Add your details and up to eight links. Download a contact card for someone to save.</p></div>')+'<p class="footnote">This browser build does not publish a profile or create a cross-device QR link. Your contact card is a file you choose to share.</p>';$('#edit-card').onclick=cardForm;if($('#download-card'))$('#download-card').onclick=()=>download(C.vcard(d,c.links),'my-contact.vcf','text/vcard');}
function cardForm(){const c=structuredClone(state.card);openModal('Edit my card',detailFields(c.details)+'<label>Card photo<input type="file" id="card-photo" accept="image/*"><span id="card-preview">'+photoPreview(c.photo,'Card photo')+'</span><button type="button" id="remove-card-photo" class="quiet removal">Remove photo</button></label><h3>Links</h3><div id="card-links"></div><button type="button" id="add-link">Add link</button>',async fd=>{const d=C.details(Object.fromEntries(fd));C.validate(d);const links=[...document.querySelectorAll('.line-link')].map(row=>({label:row.querySelector('[data-label]').value.trim(),url:row.querySelector('[data-url]').value.trim()})).filter(l=>l.label||l.url);if(links.length>8||links.some(l=>!l.label||!C.safeURL(l.url)))throw Error('Each link needs a label and a full HTTPS address. Use up to eight links.');await save(s=>s.card={details:d,links,photo:c.photo});});const draw=()=>{$('#card-links').innerHTML=c.links.map((l,i)=>'<div class="line-link"><input data-label aria-label="Link '+(i+1)+' label" placeholder="Label" value="'+E(l.label)+'" maxlength="80"><input data-url type="url" aria-label="Link '+(i+1)+' URL" placeholder="https://" value="'+E(l.url)+'"><button type="button" data-drop-link="'+i+'" aria-label="Remove link '+(i+1)+'">×</button></div>').join('');document.querySelectorAll('[data-drop-link]').forEach(b=>b.onclick=()=>{collect();c.links.splice(Number(b.dataset.dropLink),1);draw();});$('#add-link').disabled=c.links.length>=8;};const collect=()=>c.links=[...document.querySelectorAll('.line-link')].map(row=>({label:row.querySelector('[data-label]').value,url:row.querySelector('[data-url]').value}));draw();$('#add-link').onclick=()=>{collect();c.links.push({label:'',url:''});draw();};$('#card-photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;const button=$('#editor button[type=submit]');button.disabled=true;try{c.photo=await resizePhoto(file);$('#card-preview').innerHTML=photoPreview(c.photo,'Card photo');}catch(err){$('#form-error').textContent=err.message;}finally{button.disabled=false;}};$('#remove-card-photo').onclick=()=>{c.photo='';$('#card-preview').innerHTML='';};}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function shareMemory(meetingID){const m=state.meetings.find(m=>m.id===meetingID),e=state.events.find(e=>e.id===m.eventID);openModal('Share event memory','<p>This creates an offline HTML file containing only the encounter photo and the event’s name, date, and venue.</p>'+(m.photo?photoPreview(m.photo,'Photo to be shared'):'<p class="muted">This encounter has no photo.</p>')+'<p><strong>'+E(e?.name||'Event')+'</strong><br>'+E([e?.date,e?.venue].filter(Boolean).join(' · '))+'</p><p class="note">Contact details, badges, conversation notes, recordings, tags, and follow-ups are excluded. Anyone receiving the file can keep a copy; it cannot be revoked.</p>',async()=>{download(C.memory(m,e),'event-memory.html','text/html');},'Download memory');}
function exportForm(){openModal('Export notebook','<p>Contact details, encounter snapshots, and event information are included. Choose any private details to add.</p><div class="checks"><label class="check"><input name="notes" type="checkbox">Conversation notes</label><label class="check"><input name="tasks" type="checkbox">Follow-ups and due dates</label><label class="check"><input name="tags" type="checkbox">Tags</label></div><label style="margin-top:18px">Format<select name="format"><option value="csv">CSV spreadsheet</option><option value="md">Markdown document</option></select></label><p class="muted"><small>Photos, badges, recordings, My card, and trashed connections are excluded from these exports. Browser storage is not a backup of those attachments.</small></p>',async fd=>{if(!C.activeMeetings(state).length)throw Error('Add at least one encounter first.');const opts={notes:fd.has('notes'),tasks:fd.has('tasks'),tags:fd.has('tags')},md=fd.get('format')==='md';download(md?C.markdown(state,opts):C.csv(state,opts),'huddledex-export.'+(md?'md':'csv'),md?'text/markdown':'text/csv');},'Download export');}
function about(){openModal('About this browser build','<div class="stack"><p>A working browser adaptation of HuddleDex’s iPhone notebook. This is a new starter, derived from the app’s models and workflows — not the original prompt or the complete native app.</p><p><strong>Included:</strong> events, current contacts, encounter history, separate photos and badges, notes, 60-second audio clips, follow-ups, tags, filters, trash, a contact card, and selective CSV/Markdown export.</p><p><strong>Native features left out:</strong> badge OCR, on-device speech transcription, maps/globe, hosted profile publishing and QR links, account sync, and native ZIP backups.</p><p>Records are saved in this browser’s IndexedDB. There is no login, analytics, server upload, external font, AI call, or other network request in the starter. Other code on the same website origin could access browser storage; use a separate origin for a real deployment. Photo files are resized and re-encoded as JPEG. What is visible in a photo remains visible.</p><p>Use localhost or HTTPS for recording. Browser/device support varies. Clearing site data removes the notebook; exports exclude attachments. Your browser may also evict storage.</p><p><a href="README.txt" target="_blank">Read the build notes</a></p></div>');}
async function loadDemo(){if(state.people.length)return;try{await save(s=>{const e1={id:id(),name:'Small Ideas Meetup',date:'2026-05-12',venue:'The Workshop'},e2={id:id(),name:'Design & Coffee',date:'2026-06-03',venue:'North Room'};s.events.push(e1,e2);s.activeEventID=e2.id;const people=[['Alex Morgan','Product designer','Paper Lantern','Design'],['Sam Rivera','Developer','Field Notes','AI'],['Jules Chen','Photographer','Independent','Photography']];people.forEach(([name,role,company,tag],i)=>{const p={id:id(),details:C.details({name,role,company,email:name.toLowerCase().split(' ')[0]+'@example.invalid'}),tags:[tag],deletedAt:''};s.people.push(p);s.meetings.push({id:id(),personID:p.id,eventID:e1.id,snapshot:{...p.details},notes:['Talked about making tools that feel simpler. Send over that interface sketch.','Building a small local-first notebook. Compare notes on browser storage.','We both like taking a camera on long walks.'][i],task:['Send the sketch','Share the starter',''][i],due:i<2?'2026-06-10':'',done:false,photo:'',badge:'',clips:[],createdAt:'2026-05-12T16:00:00Z'});if(i===0)s.meetings.push({id:id(),personID:p.id,eventID:e2.id,snapshot:{...p.details},notes:'Caught up again over coffee. The sketch became a prototype!',task:'',due:'',done:false,photo:'',badge:'',clips:[],createdAt:'2026-06-03T17:00:00Z'});});});toast('Fictional demo loaded. Nothing came from a real notebook.');}catch(e){toast(e.message);}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));$('#export').onclick=exportForm;$('#about').onclick=about;
(async()=>{try{db=await openDB();state=await readState();render();}catch(err){$('#app').innerHTML='<div class="empty"><h1>Notebook could not open</h1><p>'+E(err.message)+'</p><p>Use a browser with IndexedDB enabled and open this file from localhost or HTTPS.</p><button id="retry">Try again</button></div>';$('#retry').onclick=()=>location.reload();}})();
</script></body></html>
